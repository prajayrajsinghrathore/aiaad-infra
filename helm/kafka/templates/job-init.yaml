apiVersion: batch/v1
kind: Job
metadata:
  name: aiaad-kafka-init
  labels:
    app.kubernetes.io/name: kafka-init
    app.kubernetes.io/instance: aiaad-kafka
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init
        app.kubernetes.io/instance: aiaad-kafka
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: "{{ .Values.initJob.image }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo 'Creating Kafka topics...'
              # Wait for kafka to be ready
              while ! bin/kafka-broker-api-versions.sh --bootstrap-server aiaad-kafka:9092; do
                echo "Waiting for kafka..."
                sleep 5
              done
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server aiaad-kafka:9092 --partitions 1 --replication-factor 1 --config retention.ms=86400000 --topic platform.domain.events
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server aiaad-kafka:9092 --partitions 1 --replication-factor 1 --config retention.ms=86400000 --topic platform.integration.events
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server aiaad-kafka:9092 --partitions 1 --replication-factor 1 --config retention.ms=86400000 --topic platform.dlq
              echo 'Topics created successfully'
