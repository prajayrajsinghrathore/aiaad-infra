apiVersion: v1
kind: Service
metadata:
  name: aiaad-kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: aiaad-kafka
spec:
  type: ClusterIP
  ports:
    - name: tcp-client
      port: 9092
      targetPort: 9092
    - name: tcp-external
      port: 29092
      targetPort: 29092
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: aiaad-kafka
