# Default values for local kafka chart.

kafka:
  image: "quay.io/strimzi/kafka:latest-kafka-4.1.1"
  replicas: 1
  resources:
    limits:
      cpu: "2.0"
      memory: "2Gi"
    requests:
      cpu: "0.5"
      memory: "512Mi"
  persistence:
    enabled: true
    storageClass: "standard"
    size: "2Gi"

initJob:
  image: "quay.io/strimzi/kafka:latest-kafka-4.1.1"

kowl:
  enabled: true
  image: "quay.io/cloudhut/kowl:v1.5.0"
  resources:
    limits:
      cpu: "0.5"
      memory: "512Mi"
    requests:
      cpu: "0.25"
      memory: "256Mi"
