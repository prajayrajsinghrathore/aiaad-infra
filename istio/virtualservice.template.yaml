apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: aiaad-platform-routing
  namespace: aiaad-platform
spec:
  hosts:
  - "${GATEWAY_HOST}"
  gateways:
  - "${GATEWAY_NAMESPACE}/${GATEWAY_NAME}"
  http:
  - match:
    - uri:
        prefix: /api
    route:
    - destination:
        host: placeholder-service.aiaad-platform.svc.cluster.local
        port:
          number: 80
